# 后台的公网入口：HTTPS（端口 8443），转发到本机 127.0.0.1:8080
# 放到 /etc/nginx/conf.d/kiya-admin.conf；证书生成见 deploy/admin/README.md
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/kiya-admin.crt;
    ssl_certificate_key /etc/nginx/ssl/kiya-admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    client_max_body_size 2m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 用连接的真实地址覆盖（不是追加），防止伪造 X-Forwarded-For 绕过登录限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_read_timeout 300s;
        # 视频按 Range 分段读取，不在 nginx 落盘缓存
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
