# 主播配置：娜由纪雅kiya
streamer:
  name: 娜由纪雅kiya
  uid: 646830928
  room_id: 1724773744
  live_url: https://live.bilibili.com/1724773744
  space_url: https://space.bilibili.com/646830928

# 弹幕分析参数（阶段 0 / 1）
analysis:
  bucket_seconds: 10          # 分桶大小
  baseline_seconds: 300       # 滑动基线窗口：用前 5 分钟均值做对比，避免开播“打招呼”刷屏干扰
  smooth_seconds: 30          # 平滑窗口
  min_peak_gap_seconds: 60    # 两个高峰至少间隔，太近的合并
  top_n: 20                   # 最多输出几个候选（只是上限，不会为了凑数硬塞）
  min_score: null             # 分数线：低于它的高峰不剪、不送审。用 evaluate.py --sweep 按标注结果定，null = 不设线
  music_filter: false         # 歌回过滤：true = 唱歌 / 纯音乐占比超过 music_threshold 的高峰不进候选（先看 candidates.json 的 music 值再决定开不开）
  music_threshold: 0.45
  danmaku_delay_seconds: 5    # 观众反应比画面慢；delay_mode=auto 且有音频时自动估计，否则用这个值
  delay_mode: auto            # auto：用弹幕热度与响度的互相关估计；fixed：固定用上面的值
  delay_range_seconds: [1, 15]
  clip_before_seconds: 30     # 候选片段：峰值前取多少秒
  clip_after_seconds: 30      # 候选片段：峰值后取多少秒

# 边播边筛（监控脚本 KIYA_LIVE_SCREEN=1 时，直播中每 30 分钟对已录完的分段粗筛一次）
live_screen:
  quiet_seconds: 120          # 文件最近这么多秒内改过的分段算“还在录”，不参与
  min_seconds: 900            # 已录完的部分不到这么久先不筛（样本太少，分数不稳）

# 信号权重。没有录像特征（只跑弹幕分析）时只用前三项，自动按比例归一化
weights:
  density: 0.35      # 弹幕密度（相对前 5 分钟）
  emotion: 0.20      # 情绪词 / 专属梗占比
  gift: 0.15         # 礼物、SC、上舰金额
  audio: 0.20        # 响度突增（相对前 5 分钟，dB）
  scene: 0.10        # 画面变化（关键帧差异）
  laugh: 0.15        # 主播原话里的笑声（哈哈哈 / 嘿嘿 / 笑死，需要转写）
  scream: 0.05       # 尖叫、高音大笑（响度 + 高频突增）

# 语音转写（阿里云百炼录音文件识别，不需要 GPU）。scripts/transcribe.py 使用
asr:
  model: fun-asr               # 2026-11-09 实测 fun-asr 明显更准（舰长、舰礼认得对，断句短）；paraformer-v2 便宜约 2/3
  language_hints: [zh, en, ja] # 仅 paraformer-v2 生效
  vocabulary_id: ""            # 一般留空：hotwords.py sync 会把热词表 ID 写进 .env；这里填了则优先用这里的
  hotword_prefix: kiya         # 热词表名前缀（小写字母 / 数字，最多 10 位）
  hotword_weight: 4            # 默认权重 1–5，太高会把别的词也认成热词
  # 热词 = 下面这些 + lore 里的昵称、粉丝名、观众称呼、世界观、口头禅、常见话题 + lore_words（自动合并去重）
  # 看 transcript.txt 发现总认错的词就加在这里，然后运行 python scripts/hotwords.py sync
  hotwords: [舰长, 舰礼, 上舰, 提督, 总督, 大航海, 醒目留言, 粉丝牌, 直播间, 切片, 录播, 歌回, 杂谈, QQ糖]

# 精排（scripts/rerank.py）：多模态大模型给每个候选打分、找笑点、建议起止，再和粗筛分数合成排序
rerank:
  prompt: rerank_v4          # prompts/ 里的提示词文件（v4 = v3 + 证据 / 风险 / 置信度 / 失败原因 + 给剪辑的交接字段；效果不好改回 rerank_v3）
  model: ""                  # 空 = 用 .env 的 DASHSCOPE_MODEL
  frames: 8                  # 每个候选抽几张图（越多越贵）
  width: 640                 # 截图宽度
  frames_mode: peak          # 抽帧方式：uniform = 均匀；peak = 一半集中在粗筛高峰前后（表情多半在那里）、一半均匀看全貌
  danmaku_smart: true        # 弹幕超过 danmaku_limit 条时：优先保留情绪词 / 专属梗和离高峰近的，其余均匀抽样；false = 全部均匀抽样
  danmaku_limit: 60
  context_before: 120        # 前情：片段前多少秒的原话（起止最多往前取这么多）
  context_after: 240         # 后续：片段后多少秒的原话（看笑点之后的反应；起止也最多往后取这么多）
  pick_score: 8              # 推荐发布的最低分（还要求：有趣 + 能单独看懂 + 起承转合完整 + 风险不是 high）
  pick_confidence: 0.6       # 推荐发布要求大模型的把握（confidence）不低于这个值；0 = 不看
  listwise: true             # 同场二次比较：通过单条评审的候选再横向比一次，分 推荐 / 备选 / 淘汰（多一次文本请求，很便宜；失败不影响单条结果）
  listwise_prompt: rerank_list_v1
  listwise_min_score: 7      # 单条分数达到这个值的才进二次比较
  listwise_top_n: 10         # 最多拿几条进二次比较
  listwise_max_pick: 3       # 一场最多推荐几条
  workers: 3                 # 并发请求数
  # 最终分 = 大模型分 × llm + 粗筛名次分 × screen；判为不值得切的再 × not_funny。
  # 后台“精排记忆”页确认过的新权重优先于这里（config/memory_decisions.json）
  weights: {llm: 0.8, screen: 0.2, not_funny: 0.6, not_standalone: 0.7}
  min_len: 20                # 边界修正后的最短 / 最长时长（秒）；按内容定，最短 20 秒、最长 480 秒
  max_len: 480
  price_in: null             # 单价（元 / 百万 tokens），填了就估算费用
  price_out: null

# 主播周报（scripts/weekly_report.py）：只是统计，不调大模型
weekly:
  days: 7                    # 统计最近几天的场次
  memes_top: 5               # 最火的梗 / 说法列几个
  highlights_top: 5          # 高光场面列几个
  words_top: 40              # 词云放多少个词
  min_mentions: 5            # 一个说法本周至少出现几次（主播说 + 观众刷）才算梗，不够就少列，不凑数
  min_type_items: 5          # 本周高光片段攒够几个才出“哪类内容更出效果”的占比

# 精排记忆（scripts/learn.py）：从录制、审核、投稿里自动积累，填进提示词 rerank_v2 的【积累】
memory:
  min_sessions: 2            # 一个说法至少在几场里出现才算梗（只有一场时不会加任何梗）
  lore_max: 30               # 最多保留多少个自动发现的说法
  lore_in_prompt: 25         # 提示词里放多少个
  streamer_uploads: 20       # 拉主播最新多少条投稿
  streamer_titles: 10        # 提示词里放多少条她的投稿标题
  my_uploads: 30             # 拉切片号最新多少条投稿（UID 在后台填）
  min_published: 5           # 切片号绑定满几条才按类型汇总表现
  min_label_sessions: 3      # 几场“精排 + 标注”后才开始建议新权重
  examples_yes: 3            # 提示词里放几个“值得切”的审核例子（不含正在精排的这一场）
  examples_no: 3
  min_boundary_votes: 8      # 审核时点“开头 / 结尾太早 / 太晚”的票数攒够，且一边倒才提示调 clip_before / clip_after_seconds
  min_edits: 5               # 人工改过的 AI 初稿攒够几条才影响 AI 初稿（且来自 min_edit_sessions 场以上）
  min_edit_sessions: 2

# 发布包（scripts/publish_pack.py）：B站投稿用的封面、标题、简介、标签，后台成片编辑页“发布”卡片里改和复制
publish:
  fixed_tags: [虚拟主播, 直播切片, VTuber, 娜由纪雅]   # 每条都带；再加主播名、类型、片段里出现的梗，最多 10 个
  cover_font: "Noto Sans CJK SC:bold"   # fc-match 的写法；装了综艺体可以换成 "ZCOOL KuaiLe"
  cover_color: "#FFE14D"
  cover_stroke: "#E0457B"
  # 一键发布到 B站（scripts/publish_bili.py，用 biliup 命令行；要先在服务器上装 biliup 并 `biliup login`，见 deploy/README.md）
  bili:
    cookie: ~/.config/biliup/cookies.json   # biliup login 生成的登录文件（权限 600，别提交到 git）
    hold_days: 14            # “先放着”：定时发布设到几天后（B站最长约 15 天，创作中心里能改 / 撤回）
    min_interval_sec: 600    # 同一主播两次上传的最短间隔，防止连点触发风控
    tid: 21                  # 投稿分区 id（21 = 生活·日常；按你的账号习惯改）
    submit: ""               # biliup 的提交接口：空 = 用它的默认；也可填 web / client / app
    line: ""                 # 上传线路，空 = 自动
    # private_args: []       # “仅自己可见”：biliup 没有这个参数，验证过能用的参数填这里才会出现在弹窗里
  # 简介模板：{what_happened} 精排的一句话、{streamer} {space_url} {live_url}、{date} 场次日期、{time} 片段在直播里的时间
  desc_template: |
    {what_happened}

    主播：{streamer} {space_url}
    直播间：{live_url}
    出自 {date} 的直播（约 {time}）

    非官方切片，仅为推广主播；如有不妥请联系删除。

# 剪辑脚本初稿（scripts/autoedit.py）
autoedit:
  prompt: edit_v5            # v5 = v4 + 照着精排的交接编排（前情字幕 / 节拍 / 笑点原话 / 开头怎么改）；v4 = v3 + 多版本风格档位；v3 = v2 + 梗库（只用后台确认过的梗；v2 = v1 + 剪辑师口味，人工改过的初稿攒够 memory.min_edits 条才生效）
  model: ""
  max_stickers: 2            # 一条切片最多几个贴图，同一个贴图整条只能用一次（贴图要先写含义说明：scripts/describe_stickers.py）
  max_items: 8               # 一条切片最多几个效果（标准版；克制版最多 3 个，热闹版多 3 个）
  variants:                  # 多版本初稿：前 top_n 个候选各出一版，其余只出标准版（多一版 = 多一次大模型调用）
    top_n: 5
    styles: [restrained, standard, lively]   # 克制 / 标准 / 热闹

# 梗库（scripts/memes.py、clipper/memes.py）：B站热门每天抓一次标题 / 热搜，提炼高频短语；新梗要后台确认含义和尺度后才会被剪辑初稿用
memes:
  embed_model: ""            # 文本向量模型，空 = 环境变量 DASHSCOPE_EMBED_MODEL 或 text-embedding-v3；没有 Key 时退回字面匹配
  hot_min_titles: 3          # 一个短语至少在几个热门标题里出现，才算热词
  hot_pending_max: 60        # 每次最多放多少个新的热词进“待确认”
  min_heat: 0.5              # 热门梗近 7 天加权日均出现次数低于它算“降温”，检索权重 ×0.3（弹幕 / 转写来的：近 14 天不到 1 次）
  max_level: 2               # 尺度：1 大众 2 圈层 3 谨慎；大于它的不自动用
  retrieve_k: 10             # 每条给大模型几个候选
  min_sim: 0.35              # 向量相似度低于它不给（宁缺毋滥）
  min_lexical: 0.2           # 没有向量、退回字面匹配时的门槛
  max_per_clip: 2            # 一条切片最多用几个梗
  min_gap: 15                # 两个梗至少隔几秒
  min_uses: 5                # 一个梗被初稿用过、人工看过终稿的次数达到它，才看保留率
  low_retention: 0.4         # 保留率低于它降权 ×0.5（人总是把这个梗删了）

# 情绪词典：命中即计入“情绪词占比”。按 VTuber 圈和 kiya 粉丝的梗持续扩充
emotion_words:
  laugh: [哈哈, hhh, "233", 草, 笑死, 绷, 蚌埠住, 乐, 好好笑, xswl, 笑不活]
  surprise: ["？", "?", 啊这, 卧槽, 我草, 震惊, 离谱, 逆天, 什么]
  hype: ["666", 牛, 好强, 帅, 高能, 名场面, 切片, 录屏, 截图]
  cute: [可爱, awsl, 好耶, 贴贴, 嘿嘿]
  sad: [破防, 心疼, 哭, 呜呜, 寄]

# 计入情绪词得分的 kiya 专属梗（只放“出现就说明有事发生”的词；常见称呼不要放，否则全场都在命中）
lore_words: [做局, 禁言凶手, 律师函, 牢猫]

# 主播梗百科（不参与弹幕打分）：用作 ASR 热词、大模型上下文、标题生成。详见 docs/主播档案-娜由纪雅kiya.md
lore:
  nicknames: [kiya, "72", 娜由纪雅, 粉毛小猫, 牢猫]
  fan_name: ki由米
  audience_call: 人类酱
  world: [咪嗷岛, ko li]
  catchphrases: [喵, 泥嚎, 空你几哇, 歌会走调但kiya不会走掉, 掉落一只双马尾]
  persona: [猫娘, 粉色头发, 双马尾, 温柔治愈杂谈势, 窝囊势, 抽象]
  recurring_topics: [舰长, 禁言, 做局, 旮旯给木, 钓鱼, 不怕死挑战, 翻唱]
  # 她自己的高播放切片标题（大模型起标题时参考风格）
  title_examples: [舰长寄来律师函：请停止你的报恩行为, 妈妈我D到傻V了, 你们都是禁言凶手！！！]
  # 同名 / 近名主播：标题标签写全名，检索时排除
  not_to_confuse: [金飞龙Kiya, 芙宴璃kiya]
