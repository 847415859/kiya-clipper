# 主播配置：娜由纪雅kiya
streamer:
  name: 娜由纪雅kiya
  uid: 646830928
  room_id: 1724773744
  live_url: https://live.bilibili.com/1724773744
  space_url: https://space.bilibili.com/646830928

# 弹幕分析参数（阶段 0 / 1）
analysis:
  bucket_seconds: 10          # 分桶大小
  baseline_seconds: 300       # 滑动基线窗口：用前 5 分钟均值做对比，避免开播“打招呼”刷屏干扰
  smooth_seconds: 30          # 平滑窗口
  min_peak_gap_seconds: 60    # 两个高峰至少间隔，太近的合并
  top_n: 20                   # 最多输出几个候选（只是上限，不会为了凑数硬塞）
  min_score: null             # 分数线：低于它的高峰不剪、不送审。用 evaluate.py --sweep 按标注结果定，null = 不设线
  music_filter: false         # 歌回过滤：true = 唱歌 / 纯音乐占比超过 music_threshold 的高峰不进候选（先看 candidates.json 的 music 值再决定开不开）
  music_threshold: 0.45
  danmaku_delay_seconds: 5    # 观众反应比画面慢；delay_mode=auto 且有音频时自动估计，否则用这个值
  delay_mode: auto            # auto：用弹幕热度与响度的互相关估计；fixed：固定用上面的值
  delay_range_seconds: [1, 15]
  clip_before_seconds: 30     # 候选片段：峰值前取多少秒
  clip_after_seconds: 30      # 候选片段：峰值后取多少秒

# 信号权重。没有录像特征（只跑弹幕分析）时只用前三项，自动按比例归一化
weights:
  density: 0.35      # 弹幕密度（相对前 5 分钟）
  emotion: 0.20      # 情绪词 / 专属梗占比
  gift: 0.15         # 礼物、SC、上舰金额
  audio: 0.20        # 响度突增（相对前 5 分钟，dB）
  scene: 0.10        # 画面变化（关键帧差异）
  laugh: 0.15        # 主播原话里的笑声（哈哈哈 / 嘿嘿 / 笑死，需要转写）
  scream: 0.05       # 尖叫、高音大笑（响度 + 高频突增）

# 语音转写（阿里云百炼录音文件识别，不需要 GPU）。scripts/transcribe.py 使用
asr:
  model: fun-asr               # 2026-11-09 实测 fun-asr 明显更准（舰长、舰礼认得对，断句短）；paraformer-v2 便宜约 2/3
  language_hints: [zh, en, ja] # 仅 paraformer-v2 生效
  vocabulary_id: ""            # 一般留空：hotwords.py sync 会把热词表 ID 写进 .env；这里填了则优先用这里的
  hotword_prefix: kiya         # 热词表名前缀（小写字母 / 数字，最多 10 位）
  hotword_weight: 4            # 默认权重 1–5，太高会把别的词也认成热词
  # 热词 = 下面这些 + lore 里的昵称、粉丝名、观众称呼、世界观、口头禅、常见话题 + lore_words（自动合并去重）
  # 看 transcript.txt 发现总认错的词就加在这里，然后运行 python scripts/hotwords.py sync
  hotwords: [舰长, 舰礼, 上舰, 提督, 总督, 大航海, 醒目留言, 粉丝牌, 直播间, 切片, 录播, 歌回, 杂谈, QQ糖]

# 精排（scripts/rerank.py）：多模态大模型给每个候选打分、找笑点、建议起止，再和粗筛分数合成排序
rerank:
  prompt: rerank_v2          # prompts/ 里的提示词文件（v2 = v1 + 自动积累的“精排记忆”）
  model: ""                  # 空 = 用 .env 的 DASHSCOPE_MODEL
  frames: 8                  # 每个候选抽几张图（越多越贵）
  width: 640                 # 截图宽度
  context_before: 60         # 前情：片段前多少秒的原话
  workers: 3                 # 并发请求数
  # 最终分 = 大模型分 × llm + 粗筛名次分 × screen；判为不值得切的再 × not_funny。
  # 后台“精排记忆”页确认过的新权重优先于这里（config/memory_decisions.json）
  weights: {llm: 0.8, screen: 0.2, not_funny: 0.6}
  min_len: 30                # 边界修正后的最短 / 最长时长（秒）
  max_len: 180
  price_in: null             # 单价（元 / 百万 tokens），填了就估算费用
  price_out: null

# 精排记忆（scripts/learn.py）：从录制、审核、投稿里自动积累，填进提示词 rerank_v2 的【积累】
memory:
  min_sessions: 2            # 一个说法至少在几场里出现才算梗（只有一场时不会加任何梗）
  lore_max: 30               # 最多保留多少个自动发现的说法
  lore_in_prompt: 25         # 提示词里放多少个
  streamer_uploads: 20       # 拉主播最新多少条投稿
  streamer_titles: 10        # 提示词里放多少条她的投稿标题
  my_uploads: 30             # 拉切片号最新多少条投稿（UID 在后台填）
  min_published: 5           # 切片号绑定满几条才按类型汇总表现
  min_label_sessions: 3      # 几场“精排 + 标注”后才开始建议新权重
  examples_yes: 3            # 提示词里放几个“值得切”的审核例子（不含正在精排的这一场）
  examples_no: 3

# 剪辑脚本初稿（scripts/autoedit.py）
autoedit:
  prompt: edit_v1
  model: ""
  max_items: 8               # 一条切片最多几个效果

# 情绪词典：命中即计入“情绪词占比”。按 VTuber 圈和 kiya 粉丝的梗持续扩充
emotion_words:
  laugh: [哈哈, hhh, "233", 草, 笑死, 绷, 蚌埠住, 乐, 好好笑, xswl, 笑不活]
  surprise: ["？", "?", 啊这, 卧槽, 我草, 震惊, 离谱, 逆天, 什么]
  hype: ["666", 牛, 好强, 帅, 高能, 名场面, 切片, 录屏, 截图]
  cute: [可爱, awsl, 好耶, 贴贴, 嘿嘿]
  sad: [破防, 心疼, 哭, 呜呜, 寄]

# 计入情绪词得分的 kiya 专属梗（只放“出现就说明有事发生”的词；常见称呼不要放，否则全场都在命中）
lore_words: [做局, 禁言凶手, 律师函, 牢猫]

# 主播梗百科（不参与弹幕打分）：用作 ASR 热词、大模型上下文、标题生成。详见 docs/主播档案-娜由纪雅kiya.md
