# 主播配置：娜由纪雅kiya
streamer:
  name: 娜由纪雅kiya
  uid: 646830928
  room_id: 1724773744
  live_url: https://live.bilibili.com/1724773744
  space_url: https://space.bilibili.com/646830928

# 弹幕分析参数（阶段 0 / 1）
analysis:
  bucket_seconds: 10          # 分桶大小
  baseline_seconds: 300       # 滑动基线窗口：用前 5 分钟均值做对比，避免开播“打招呼”刷屏干扰
  smooth_seconds: 30          # 平滑窗口
  min_peak_gap_seconds: 60    # 两个高峰至少间隔，太近的合并
  top_n: 20                   # 输出前 N 个高峰
  danmaku_delay_seconds: 5    # 观众反应比画面慢；delay_mode=auto 且有音频时自动估计，否则用这个值
  delay_mode: auto            # auto：用弹幕热度与响度的互相关估计；fixed：固定用上面的值
  delay_range_seconds: [1, 15]
  clip_before_seconds: 30     # 候选片段：峰值前取多少秒
  clip_after_seconds: 30      # 候选片段：峰值后取多少秒

# 信号权重。没有录像特征（只跑弹幕分析）时只用前三项，自动按比例归一化
weights:
  density: 0.35      # 弹幕密度（相对前 5 分钟）
  emotion: 0.20      # 情绪词 / 专属梗占比
  gift: 0.15         # 礼物、SC、上舰金额
  audio: 0.20        # 响度突增（相对前 5 分钟，dB）
  scene: 0.10        # 画面变化（关键帧差异）

# 语音转写（阿里云百炼录音文件识别，不需要 GPU）。scripts/transcribe.py 使用
asr:
  model: fun-asr               # 2026-11-09 实测 fun-asr 明显更准（舰长、舰礼认得对，断句短）；paraformer-v2 便宜约 2/3
  language_hints: [zh, en, ja] # 仅 paraformer-v2 生效
  vocabulary_id: ""            # 热词表 ID（阶段 2 用 lore 里的名字和梗创建后填这里）

# 情绪词典：命中即计入“情绪词占比”。按 VTuber 圈和 kiya 粉丝的梗持续扩充
emotion_words:
  laugh: [哈哈, hhh, "233", 草, 笑死, 绷, 蚌埠住, 乐, 好好笑, xswl, 笑不活]
  surprise: ["？", "?", 啊这, 卧槽, 我草, 震惊, 离谱, 逆天, 什么]
  hype: ["666", 牛, 好强, 帅, 高能, 名场面, 切片, 录屏, 截图]
  cute: [可爱, awsl, 好耶, 贴贴, 嘿嘿]
  sad: [破防, 心疼, 哭, 呜呜, 寄]

# 计入情绪词得分的 kiya 专属梗（只放“出现就说明有事发生”的词；常见称呼不要放，否则全场都在命中）
lore_words: [做局, 禁言凶手, 律师函, 牢猫]

# 主播梗百科（不参与弹幕打分）：用作 ASR 热词、大模型上下文、标题生成。详见 docs/主播档案-娜由纪雅kiya.md
lore:
  nicknames: [kiya, "72", 娜由纪雅, 粉毛小猫, 牢猫]
  fan_name: ki由米
  audience_call: 人类酱
  world: [咪嗷岛, ko li]
  catchphrases: [喵, 泥嚎, 空你几哇, 歌会走调但kiya不会走掉, 掉落一只双马尾]
  persona: [猫娘, 粉色头发, 双马尾, 温柔治愈杂谈势, 窝囊势, 抽象]
  recurring_topics: [舰长, 禁言, 做局, 旮旯给木, 钓鱼, 不怕死挑战, 翻唱]
  # 同名 / 近名主播：标题标签写全名，检索时排除
  not_to_confuse: [金飞龙Kiya, 芙宴璃kiya]
