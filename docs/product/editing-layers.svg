<g fill="#a7d8cf"><rect x="240" y="296" width="250" height="50" rx="8"/><rect x="500" y="296" width="350" height="50" rx="8"/><rect x="860" y="296" width="250" height="50" rx="8"/><rect x="1120" y="296" width="248" height="50" rx="8"/></g>
