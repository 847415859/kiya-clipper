<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#faf8ff">
<text x="58" y="66" font-size="18" fill="#bbb0d6">内容与制作关系示意 · 非真实编辑器截图 / 非现有多轨 UI 承诺</text>
<text x="58" y="118" font-size="34" font-weight="700">让每个制作动作，都有内容上的理由</text>
<text x="58" y="157" font-size="19" fill="#c3bdcf">以下为解释性案例；不是已经验证的可洛风格规则。</text>
<g font-size="19" fill="#c3bdcf"><text x="58" y="230">内容节点</text><text x="58" y="325">注意力</text><text x="58" y="420">画面 / 字幕</text><text x="58" y="515">声音 / 节奏</text></g>
