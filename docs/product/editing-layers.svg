<g fill="#e5d5ac"><rect x="240" y="486" width="530" height="50" rx="8"/><rect x="780" y="486" width="330" height="50" rx="8"/><rect x="1120" y="486" width="248" height="50" rx="8"/></g>
<g fill="#29243b" font-size="20"><text x="262" y="234">看懂问题与前情</text><text x="522" y="234">主播回答与表达</text><text x="802" y="234">转折 / 反应 / 补充</text><text x="1142" y="234">事件完成与收束</text><text x="262" y="329">实际问题或对象</text><text x="522" y="329">人物与表情</text><text x="882" y="329">关键对象 / 反应</text><text x="1142" y="329">回到人物与主线</text><text x="262" y="424">清楚呈现原话，保留阅读时间</text><text x="802" y="424">有理由的强调或插入</text><text x="1142" y="424">减少多余包装</text><text x="262" y="519">保护原声，保留必要等待</text><text x="802" y="519">按作用选择声音提示</text><text x="1142" y="519">自然结束或淡出</text></g>
<text x="58" y="613" font-size="20" fill="#c3bdcf">当前已有字幕、运镜、贴图和音乐等基础；完整的条件化编排、独立音效轨与素材配方仍需扩展验证。</text>
