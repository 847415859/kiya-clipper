# kiya-admin 配置。敏感项（数据库密码、初始管理员密码）通过环境变量传入，见 deploy/admin/README.md
server:
  address: ${KIYA_ADMIN_ADDRESS:127.0.0.1}   # 只监听本机，由 nginx 对外提供 HTTPS
  port: ${KIYA_ADMIN_PORT:8080}
  forward-headers-strategy: native           # 信任本机 nginx 传来的真实 IP / https 标记（登录限流按真实 IP 算）
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict
        secure: ${KIYA_COOKIE_SECURE:true}  # 只走 HTTPS；用 SSH 隧道等 http 方式访问时设为 false

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/${DB_NAME:kiya_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:kiya}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always                           # 启动时执行 schema.sql（全是 CREATE TABLE IF NOT EXISTS）
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB      # 贴图上传
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

kiya:
  repo-dir: ${KIYA_REPO_DIR:/opt/kiya-clipper}   # 仓库目录（worker、config、eval 都在下面）
  rec-dir: ${REC_DIR:/data/rec}                  # 录播姬录像目录
  streamer: ${KIYA_STREAMER:kiya}                # 当前管理的主播标识：数据、记忆、评测按它隔离（见 docs/多主播支持.md）
  python: ${KIYA_PYTHON:}                        # 默认 <repo-dir>/worker/.venv/bin/python
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:}             # 只在第一次启动、还没有账号时使用；留空则随机生成并打印到日志
  task-timeout-minutes: 180

logging:
  level:
    root: INFO
